
services:
  backend:
    build :
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
        - "27017:27017"
    volumes:
        - mongodb_data:/data/db
      
volumes:
  mongodb_data: